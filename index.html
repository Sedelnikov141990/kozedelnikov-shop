<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин изделий</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f4f4f5;
      color: #222;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .price {
      font-weight: bold;
      color: #2e7d32;
      font-size: 16px;
      margin: 8px 0;
    }
    button {
      width: 100%;
      background-color: #2481cc;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>🏷️ Каталог изделий</h2>

  <div class="card">
    <h3>💼 Кожаный кошелек</h3>
    <p>Ручная работа, натуральная кожа.</p>
    <div class="price">3 500 ₽</div>
    <button onclick="order('Кожаный кошелек', 3500)">Заказать</button>
  </div>

  <div class="card">
    <h3>📦 Деревянная шкатулка</h3>
    <p>Резьба по дереву, дуб.</p>
    <div class="price">5 000 ₽</div>
    <button onclick="order('Деревянная шкатулка', 5000)">Заказать</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function order(productName, price) {
      tg.sendData(JSON.stringify({
        product: productName,
        price: price
      }));
      tg.close();
    }
  </script>
</body>
</html>
