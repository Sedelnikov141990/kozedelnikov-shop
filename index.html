<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kozhedelnikov | Мастерская кожаных изделий</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #12100e;
      --card-bg: #1c1815;
      --accent-color: #d4a373;
      --accent-hover: #e0b080;
      --text-main: #fefae0;
      --text-muted: #a39e93;
      --border-color: #332b25;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 90px;
      line-height: 1.4;
    }

    header {
      padding: 20px 16px 12px;
      background: linear-gradient(180deg, #1c1815 0%, #12100e 100%);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--accent-color);
      text-align: center;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
    }

    .categories-wrapper {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 0;
    }

    .categories-wrapper::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-btn.active {
      background: var(--accent-color);
      color: #12100e;
      border-color: var(--accent-color);
      font-weight: 600;
    }

    .container {
      padding: 16px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }

    .product-card:active {
      transform: scale(0.98);
    }

    .product-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background-color: #26201b;
      cursor: pointer;
    }

    .product-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-category-tag {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--accent-color);
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .product-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 38px;
      cursor: pointer;
    }

    .product-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-top: auto;
      margin-bottom: 8px;
    }

    .add-btn {
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
    }

    .add-btn:active {
      background: var(--accent-color);
      color: #12100e;
    }

    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: var(--accent-color);
      color: #12100e;
      padding: 14px 20px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      z-index: 200;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
    }

    .cart-bar.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .cart-count-badge {
      background: #12100e;
      color: var(--accent-color);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      margin-left: 8px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-height: 85vh;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 20px;
      overflow-y: auto;
      border-top: 1px solid var(--border-color);
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      color: var(--accent-color);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
    }

    .gallery-wrapper {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      border-radius: var(--radius);
      margin-bottom: 8px;
    }

    .gallery-wrapper::-webkit-scrollbar {
      display: none;
    }

    .gallery-wrapper img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      flex-shrink: 0;
      scroll-snap-align: start;
      border-radius: var(--radius);
      background-color: #26201b;
    }

    .gallery-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border-color);
      transition: all 0.2s;
    }

    .dot.active {
      background: var(--accent-color);
      width: 16px;
      border-radius: 10px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .cart-item-img {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      object-fit: cover;
    }

    .cart-item-details {
      flex-grow: 1;
    }

    .cart-item-title {
      font-size: 13px;
      font-weight: 600;
    }

    .cart-item-options {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .cart-item-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-color);
      margin-top: 4px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-color);
      padding: 4px 8px;
      border-radius: 8px;
    }

    .qty-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 20px;
      text-align: center;
    }

    .form-group {
      margin-top: 14px;
    }

    .form-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--accent-color);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-main);
    }

    .checkout-btn {
      background: var(--accent-color);
      color: #12100e;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 15px;
      margin-top: 20px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .checkout-btn:active {
      opacity: 0.8;
    }

    .empty-cart-msg {
      text-align: center;
      padding: 30px 0;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">KOZHEDELNIKOV</div>
    <div class="brand-subtitle">Leather Craft & Accessories</div>

    <div class="categories-wrapper">
      <button class="category-btn active" onclick="filterCategory('all', this)">Все товары</button>
      <button class="category-btn" onclick="filterCategory('wallets', this)">Кошельки</button>
      <button class="category-btn" onclick="filterCategory('bags', this)">Сумки</button>
      <button class="category-btn" onclick="filterCategory('accessories', this)">Аксессуары</button>
      <button class="category-btn" onclick="filterCategory('adult', this)">18+</button>
    </div>
  </header>

  <div class="container">
    <div class="products-grid" id="products-grid"></div>
  </div>

  <!-- Floating Cart Bar -->
  <div class="cart-bar" id="cart-bar" onclick="openCartModal()">
    <div>
      <span>Корзина</span>
      <span class="cart-count-badge" id="cart-count">0</span>
    </div>
    <div id="cart-total">0 ₽</div>
  </div>

  <!-- Modal: Product Detailed View with Customization -->
  <div class="modal-overlay" id="product-detail-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="detail-title">Изделие</div>
        <button class="close-btn" onclick="closeProductModal()">&times;</button>
      </div>

      <div class="gallery-wrapper" id="detail-gallery"></div>
      <div class="gallery-dots" id="gallery-dots"></div>

      <div style="padding: 10px 0;">
        <div class="product-price" id="detail-price" style="font-size: 18px; margin-bottom: 8px;"></div>
        <p id="detail-desc" style="font-size: 13px; color: var(--text-muted); line-height: 1.5;"></p>
      </div>

      <!-- Individual Options -->
      <div class="form-group">
        <label class="form-label">Цвет кожи для этого изделия:</label>
        <select class="form-select" id="item-color-select"></select>
      </div>

      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="item-engraving-check" onchange="toggleItemEngraving()">
          <label for="item-engraving-check">Персональная гравировка (+500 ₽)</label>
        </div>
      </div>

      <div class="form-group" id="item-engraving-group" style="display: none;">
        <label class="form-label">Текст/инициалы для гравировки:</label>
        <input type="text" class="form-input" id="item-engraving-text" placeholder="Например: А.С.">
      </div>

      <button class="checkout-btn" id="detail-add-btn" style="margin-top: 16px;">
        + Добавить в корзину
      </button>
    </div>
  </div>

  <!-- Modal: Cart & Delivery Details -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Ваш заказ</div>
        <button class="close-btn" onclick="closeCartModal()">&times;</button>
      </div>

      <div id="cart-items-container"></div>

      <div class="form-group">
        <label class="form-label">Способ получения:</label>
        <select class="form-select" id="delivery-method">
          <option value="СДЭК (до ПВЗ)">СДЭК (до пункта выдачи)</option>
          <option value="Почта России">Почта России</option>
          <option value="Курьер">Курьерская доставка</option>
          <option value="Самовывоз">Самовывоз из мастерской</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Номер телефона для связи:</label>
        <input type="tel" class="form-input" id="customer-phone" placeholder="+7 (999) 000-00-00">
      </div>

      <div class="form-group">
        <label class="form-label">Адрес / Комментарий к заказу:</label>
        <input type="text" class="form-input" id="customer-comment" placeholder="Город, адрес ПВЗ или пожелания">
      </div>

      <button class="checkout-btn" id="submit-btn" onclick="submitOrder()">Оформить заказ</button>
    </div>
  </div>

        desc: 'Аккуратный чокер из гладкой кожи с литым цельным кольцом и надежной застежкой.', 
        images: ['https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=600&q=80']
      },
      { 
        id: 403, 
        category: 'adult', 
        name: 'Кожаный флоггер «Craft»', 
        price: 6200, 
        desc: 'Идеально сбалансированный флоггер из мягких хвостов с удобной деревянной рукоятью в коже.', 
        images: ['https://images.unsplash.com/photo-1516762689617-e1cffffd478d?auto=format&fit=crop&w=600&q=80']
      }
    ];

    let cart = [];
    let currentModalProduct = null;

    function renderProducts(filter = 'all') {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      const filtered = filter === 'all' 
        ? products 
        : products.filter(p => p.category === filter);

      filtered.forEach(p => {
        const coverImg = (p.images && p.images.length > 0) ? p.images[0] : '';
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img class="product-img" src="${coverImg}" alt="${p.name}" loading="lazy" onclick="openProductModal(${p.id})">
          <div class="product-info">
            <div class="product-category-tag">${getCategoryName(p.category)}</div>
            <div class="product-title" onclick="openProductModal(${p.id})">${p.name}</div>
            <div class="product-desc">${p.desc}</div>
            <div class="product-price">${p.price.toLocaleString()} ₽</div>
            <button class="add-btn" onclick="openProductModal(${p.id})">Выбрать и заказать</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function getCategoryName(cat) {
      switch(cat) {
        case 'wallets': return 'Кошельки';
        case 'bags': return 'Сумки';
        case 'accessories': return 'Аксессуары';
        case 'adult': return '18+';
        default: return 'Изделие';
      }
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts(cat);
    }

    // Modal Product Details
    function openProductModal(productId) {
      const p = products.find(item => item.id === productId);
      if (!p) return;
      currentModalProduct = p;

      document.getElementById('detail-title').textContent = p.name;
      document.getElementById('detail-price').textContent = `${p.price.toLocaleString()} ₽`;
      document.getElementById('detail-desc').textContent = p.desc;

      // Заполняем доступные цвета для конкретного изделия
      const colorSelect = document.getElementById('item-color-select');
      const itemColors = p.colors && p.colors.length > 0 ? p.colors : DEFAULT_COLORS;
      colorSelect.innerHTML = itemColors.map(c => `<option value="${c}">${c}</option>`).join('');

      // Сброс полей гравировки
      document.getElementById('item-engraving-check').checked = false;
      document.getElementById('item-engraving-group').style.display = 'none';
      document.getElementById('item-engraving-text').value = '';

      // Галерея
      const gallery = document.getElementById('detail-gallery');
      const dotsContainer = document.getElementById('gallery-dots');
      const imgs = p.images && p.images.length > 0 ? p.images : [];

      gallery.innerHTML = imgs.map((src, idx) => `
        <img src="${src}" alt="${p.name} - ракурс ${idx + 1}" loading="lazy">
      `).join('');

      dotsContainer.innerHTML = imgs.length > 1 
        ? imgs.map((_, idx) => `<div class="dot ${idx === 0 ? 'active' : ''}"></div>`).join('')
        : '';

      gallery.onscroll = () => {
        const scrollIndex = Math.round(gallery.scrollLeft / gallery.clientWidth);
        const dots = dotsContainer.querySelectorAll('.dot');
        dots.forEach((d, i) => d.classList.toggle('active', i === scrollIndex));
      };

      const addBtn = document.getElementById('detail-add-btn');
      addBtn.onclick = () => {
        addItemWithCustomization();
      };

      document.getElementById('product-detail-modal').classList.add('active');
    }

    function closeProductModal() {
      document.getElementById('product-detail-modal').classList.remove('active');
      currentModalProduct = null;
    }

    function toggleItemEngraving() {
      const check = document.getElementById('item-engraving-check');
      document.getElementById('item-engraving-group').style.display = check.checked ? 'block' : 'none';
    }

    // Добавление позиции с выбранными опциями
    function addItemWithCustomization() {
      if (!currentModalProduct) return;

      const color = document.getElementById('item-color-select').value;
      const hasEngraving = document.getElementById('item-engraving-check').checked;
      const engravingText = hasEngraving ? document.getElementById('item-engraving-text').value.trim() : null;

      const unitPrice = currentModalProduct.price + (hasEngraving ? 500 : 0);
      
      // Уникальный ключ позиции (чтобы отличать один и тот же кошелек разных цветов)
      const cartKey = `${currentModalProduct.id}_${color}_${hasEngraving ? (engravingText || 'yes') : 'none'}`;

      const existing = cart.find(i => i.cartKey === cartKey);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          cartKey: cartKey,
          id: currentModalProduct.id,
          name: currentModalProduct.name,
          image: (currentModalProduct.images && currentModalProduct.images[0]) || '',
          price: unitPrice,
          color: color,
          engraving: engravingText || (hasEngraving ? 'Да' : null),
          qty: 1
        });
      }

      updateCartUI();
      closeProductModal();
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function changeQtyByKey(cartKey, delta) {
      const item = cart.find(i => i.cartKey === cartKey);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) cart = cart.filter(i => i.cartKey !== cartKey);
      }
      updateCartUI();
      renderCartItems();
    }

    function updateCartUI() {
      const cartBar = document.getElementById('cart-bar');
      const countEl = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total');

      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      countEl.textContent = totalCount;
      totalEl.textContent = `${totalPrice.toLocaleString()} ₽`;

      if (totalCount > 0) {
        cartBar.classList.add('visible');
      } else {
        cartBar.classList.remove('visible');
        closeCartModal();
      }
    }

    function renderCartItems() {
      const container = document.getElementById('cart-items-container');
      if (cart.length === 0) {
        container.innerHTML = '<div class="empty-cart-msg">Корзина пуста</div>';
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <img class="cart-item-img" src="${item.image}" alt="${item.name}">
          <div class="cart-item-details">
            <div class="cart-item-title">${item.name}</div>
            <div class="cart-item-options">
              🎨 ${item.color}
              ${item.engraving ? `<br>✍️ Гравировка: "${item.engraving}"` : ''}
            </div>
            <div class="cart-item-price">${(item.price * item.qty).toLocaleString()} ₽</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQtyByKey('${item.cartKey}', -1)">-</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="changeQtyByKey('${item.cartKey}', 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    function openCartModal() {
      renderCartItems();
      document.getElementById('cart-modal').classList.add('active');
    }

    function closeCartModal() {
      document.getElementById('cart-modal').classList.remove('active');
    }

    // Checkout
    async function submitOrder() {
      if (cart.length === 0) return;

      const phone = document.getElementById('customer-phone').value.trim();
      if (!phone) {
        if (tg && tg.showAlert) tg.showAlert('Пожалуйста, укажите ваш номер телефона.');
        else alert('Пожалуйста, укажите ваш номер телефона.');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Отправка...';

      const delivery = document.getElementById('delivery-method').value;
      const comment = document.getElementById('customer-comment').value.trim();

      const itemsTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
      const userName = user ? (user.username ? `@${user.username}` : user.first_name) : "Неизвестный";
      const userId = user ? user.id : "Не определен";

      let messageText = `🔥 <b>НОВЫЙ ЗАКАЗ (KOZHEDELNIKOV)!</b>\n\n`;
      messageText += `📋 <b>Состав заказа:</b>\n`;
      
      cart.forEach((item, idx) => {
        messageText += `\n${idx + 1}. <b>${item.name}</b> — ${item.qty} шт. (${(item.price * item.qty).toLocaleString()} ₽)\n`;
        messageText += `   🎨 Цвет: ${item.color}\n`;
        if (item.engraving) {
          messageText += `   ✍️ Гравировка: <i>${item.engraving}</i>\n`;
        }
      });

      messageText += `\n🚚 <b>Доставка:</b> ${delivery}\n`;
      messageText += `📞 <b>Телефон:</b> <code>${phone}</code>\n`;
      if (comment) messageText += `💬 <b>Комментарий:</b> ${comment}\n`;
      messageText += `\n💰 <b>ИТОГО К ОПЛАТЕ:</b> <b>${itemsTotal.toLocaleString()} ₽</b>\n\n`;
      messageText += `👤 <b>Покупатель:</b> ${userName}\n`;
      messageText += `🆔 <b>Telegram ID:</b> <code>${userId}</code>`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: ADMIN_ID,
            text: messageText,
            parse_mode: 'HTML'
          })
        });

        if (response.ok) {
          if (tg && tg.showAlert) {
            tg.showAlert('✅ Заказ успешно оформлен! Мастер свяжется с вами для уточнения деталей.', () => {
              tg.close();
            });
          } else {
            alert('✅ Заказ успешно оформлен!');
            cart = [];
            updateCartUI();
            closeCartModal();
          }
        } else {
          throw new Error('Telegram API error');
        }
      } catch (err) {
        console.error(err);
        if (tg && tg.showAlert) tg.showAlert('Ошибка при отправке заказа.');
        else alert('Ошибка при отправке заказа.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Оформить заказ';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (tg) {
        try {
          tg.ready();
          tg.expand();
        } catch (e) {}
      }
      renderProducts();
    });
  </script>
</body>
</html>
