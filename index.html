<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kozhedelnikov | Мастерская кожаных изделий</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #12100e;
      --card-bg: #1c1815;
      --accent-color: #d4a373;
      --accent-hover: #e0b080;
      --text-main: #fefae0;
      --text-muted: #a39e93;
      --border-color: #332b25;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 90px;
      line-height: 1.4;
    }

    header {
      padding: 20px 16px 12px;
      background: linear-gradient(180deg, #1c1815 0%, #12100e 100%);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--accent-color);
      text-align: center;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
    }

    .categories-wrapper {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 0;
    }

    .categories-wrapper::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-btn.active {
      background: var(--accent-color);
      color: #12100e;
      border-color: var(--accent-color);
      font-weight: 600;
    }

    .container {
      padding: 16px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }

    .product-card:active {
      transform: scale(0.98);
    }

    .product-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background-color: #26201b;
    }

    .product-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-category-tag {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--accent-color);
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .product-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 38px;
    }

    .product-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-top: auto;
      margin-bottom: 8px;
    }

    .add-btn {
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
    }

    .add-btn:active {
      background: var(--accent-color);
      color: #12100e;
    }

    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: var(--accent-color);
      color: #12100e;
      padding: 14px 20px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      z-index: 200;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
    }

    .cart-bar.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .cart-count-badge {
      background: #12100e;
      color: var(--accent-color);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      margin-left: 8px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-height: 85vh;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 20px;
      overflow-y: auto;
      border-top: 1px solid var(--border-color);
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--accent-color);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .cart-item-img {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
    }

    .cart-item-details {
      flex-grow: 1;
    }

    .cart-item-title {
      font-size: 13px;
      font-weight: 600;
    }

    .cart-item-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-color);
      margin-top: 2px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-color);
      padding: 4px 8px;
      border-radius: 8px;
    }

    .qty-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 20px;
      text-align: center;
    }

    .form-group {
      margin-top: 14px;
    }

    .form-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--accent-color);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-main);
    }

    .checkout-btn {
      background: var(--accent-color);
      color: #12100e;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 15px;
      margin-top: 20px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .checkout-btn:active {
      opacity: 0.8;
    }

    .empty-cart-msg {
      text-align: center;
      padding: 30px 0;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">KOZHEDELNIKOV</div>
    <div class="brand-subtitle">Leather Craft & Accessories</div>

    <div class="categories-wrapper">
      <button class="category-btn active" onclick="filterCategory('all', this)">Все товары</button>
      <button class="category-btn" onclick="filterCategory('wallets', this)">Кошельки</button>
      <button class="category-btn" onclick="filterCategory('bags', this)">Сумки</button>
      <button class="category-btn" onclick="filterCategory('accessories', this)">Аксессуары</button>
      <button class="category-btn" onclick="filterCategory('adult', this)">18+</button>
    </div>
  </header>

  <div class="container">
    <div class="products-grid" id="products-grid"></div>
  </div>

  <div class="cart-bar" id="cart-bar" onclick="openCartModal()">
    <div>
      <span>Корзина</span>
      <span class="cart-count-badge" id="cart-count">0</span>
    </div>
    <div id="cart-total">0 ₽</div>
  </div>

  <div class="modal-overlay" id="cart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Ваш заказ</div>
        <button class="close-btn" onclick="closeCartModal()">&times;</button>
      </div>

      <div id="cart-items-container"></div>

      <div class="form-group">
        <label class="form-label">Цвет кожи для всех изделий:</label>
        <select class="form-select" id="leather-color">
          <option value="Коньячный (Рыжий)">Коньячный (Рыжий)</option>
          <option value="Темно-коричневый (Шоколад)">Темно-коричневый (Шоколад)</option>
          <option value="Черный матовый">Черный матовый</option>
          <option value="Изумрудный (Зеленый)">Изумрудный</option>
        </select>
      </div>

      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="engraving-check" onchange="toggleEngravingInput()">
          <label for="engraving-check">Добавить персональную гравировку (+500 ₽)</label>
        </div>
      </div>

      <div class="form-group" id="engraving-text-group" style="display: none;">
        <label class="form-label">Текст или инициалы для гравировки:</label>
        <input type="text" class="form-input" id="engraving-text" placeholder="Например: А.С. или Happy Birthday">
      </div>

      <div class="form-group">
        <label class="form-label">Способ получения:</label>
        <select class="form-select" id="delivery-method">
          <option value="СДЭК (до ПВЗ)">СДЭК (до пункта выдачи)</option>
          <option value="Почта России">Почта России</option>
          <option value="Курьер">Курьерская доставка</option>
          <option value="Самовывоз">Самовывоз из мастерской</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Номер телефона для связи:</label>
        <input type="tel" class="form-input" id="customer-phone" placeholder="+7 (999) 000-00-00">
      </div>

      <div class="form-group">
        <label class="form-label">Адрес / Комментарий к заказу:</label>
        <input type="text" class="form-input" id="customer-comment" placeholder="Город, адрес ПВЗ или пожелания">
      </div>

      <button class="checkout-btn" id="submit-btn" onclick="submitOrder()">Оформить заказ</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // ================= НАСТРОЙКИ (ВСТАВЬ СВОИ ДАННЫЕ) =================
    const BOT_TOKEN = "8736449894:AAE6MmYnPSemwRFRAFUUXRiM2tFSvUaiScY";
    const ADMIN_ID = "1096196094"; // Цифровой ID Telegram (например: 123456789)
    // ==================================================================

    const products = [
      { id: 101, category: 'wallets', name: 'Бифолд «Classic Craft»', price: 4500, desc: 'Классический кошелек из плотной кожи. 4 отдела под карты и отсек для купюр.', image: 'https://images.unsplash.com/photo-1627123424574-724758594e93?auto=format&fit=crop&w=500&q=80' },
      { id: 102, category: 'wallets', name: 'Картхолдер «Slim Leather»', price: 2200, desc: 'Компактный зажим для 6 карт и наличных. Ручной седельный шов.', image: 'https://images.unsplash.com/photo-1606503830010-85f021271f28?auto=format&fit=crop&w=500&q=80' },
      { id: 103, category: 'wallets', name: 'Лонгволлет «Traveler»', price: 6800, desc: 'Вместительный портмоне для паспорта, телефона, карт и авиабилетов.', image: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500&q=80' },

      { id: 201, category: 'bags', name: 'Сумка-мессенджер «Urban»', price: 14500, desc: 'Наплечная сумка под ноутбук 14" и документы. Латунная фурнитура.', image: 'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=500&q=80' },
      { id: 202, category: 'bags', name: 'Рюкзак «Heritage»', price: 18900, desc: 'Рюкзак из толстой кожи растительного дубления с усиленными лямками.', image: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500&q=80' },
      { id: 203, category: 'bags', name: 'Поясная сумка «Bumbag»', price: 7200, desc: 'Стильная кросс-боди сумка для прогулок. Прочный регулируемый ремень.', image: 'https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=500&q=80' },

      { id: 301, category: 'accessories', name: 'Ремень «Brass Buckle»', price: 4800, desc: 'Ремень из монолитной ременной полосы 4 мм с литой латунной пряжкой.', image: 'https://images.unsplash.com/photo-1624222247344-550fb60583dc?auto=format&fit=crop&w=500&q=80' },
      { id: 302, category: 'accessories', name: 'Обложка для автодокументов', price: 3400, desc: 'Комплексный холдер для паспорта, стс, прав и банковских карт.', image: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=500&q=80' },
      { id: 303, category: 'accessories', name: 'Ключница «Key Holder»', price: 1900, desc: 'Защитит экран телефона и карманы от царапин ключами.', image: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=500&q=80' },

      { id: 401, category: 'adult', name: 'Портупея «Elegance»', price: 5500, desc: 'Изящная кожаная портупея из мягкой юфти с подгонкой по фигуре.', image: 'https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=500&q=80' },
      { id: 402, category: 'adult', name: 'Чокер с кольцом «Minimal»', price: 2500, desc: 'Аккуратный чокер из премиальной кожи с литым латунным кольцом.', image: 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=500&q=80' },
      { id: 403, category: 'adult', name: 'Кожаный флоггер «Craft»', price: 6200, desc: 'Сбалансированный флоггер из мягких хвостов с резной рукоятью.', image: 'https://images.unsplash.com/photo-1516762689617-e1cffffd478d?auto=format&fit=crop&w=500&q=80' }
    ];

    let cart = [];

    function renderProducts(filter = 'all') {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      const filtered = filter === 'all' 
        ? products 
        : products.filter(p => p.category === filter);

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img class="product-img" src="${p.image}" alt="${p.name}" loading="lazy">
          <div class="product-info">
            <div class="product-category-tag">${getCategoryName(p.category)}</div>
            <div class="product-title">${p.name}</div>
            <div class="product-desc">${p.desc}</div>
            <div class="product-price">${p.price.toLocaleString()} ₽</div>
            <button class="add-btn" onclick="addToCart(${p.id})">+ В корзину</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function getCategoryName(cat) {
      switch(cat) {
        case 'wallets': return 'Кошельки';
        case 'bags': return 'Сумки';
        case 'accessories': return 'Аксессуары';
        case 'adult': return 'Изделия 18+';
        default: return 'Изделие';
      }
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts(cat);
    }

    function addToCart(productId) {
      const item = cart.find(i => i.id === productId);
      if (item) {
        item.qty += 1;
      } else {
        const product = products.find(p => p.id === productId);
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function changeQty(productId, delta) {
      const item = cart.find(i => i.id === productId);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) cart = cart.filter(i => i.id !== productId);
      }
      updateCartUI();
      renderCartItems();
    }

    function updateCartUI() {
      const cartBar = document.getElementById('cart-bar');
      const countEl = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total');

      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      countEl.textContent = totalCount;
      totalEl.textContent = `${totalPrice.toLocaleString()} ₽`;

      if (totalCount > 0) {
        cartBar.classList.add('visible');
      } else {
        cartBar.classList.remove('visible');
        closeCartModal();
      }
    }

    function renderCartItems() {
      const container = document.getElementById('cart-items-container');
      if (cart.length === 0) {
        container.innerHTML = '<div class="empty-cart-msg">Корзина пуста</div>';
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <img class="cart-item-img" src="${item.image}" alt="${item.name}">
          <div class="cart-item-details">
            <div class="cart-item-title">${item.name}</div>
            <div class="cart-item-price">${(item.price * item.qty).toLocaleString()} ₽</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    function openCartModal() {
      renderCartItems();
      document.getElementById('cart-modal').classList.add('active');
    }

    function closeCartModal() {
      document.getElementById('cart-modal').classList.remove('active');
    }

    function toggleEngravingInput() {
      const check = document.getElementById('engraving-check');
      document.getElementById('engraving-text-group').style.display = check.checked ? 'block' : 'none';
    }

    async function submitOrder() {
      if (cart.length === 0) return;

      const phone = document.getElementById('customer-phone').value.trim();
      if (!phone) {
        if (tg && tg.showAlert) tg.showAlert('Пожалуйста, укажите ваш номер телефона.');
        else alert('Пожалуйста, укажите ваш номер телефона.');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Отправка...';

      const color = document.getElementById('leather-color').value;
      const hasEngraving = document.getElementById('engraving-check').checked;
      const engravingText = document.getElementById('engraving-text').value.trim();
      const delivery = document.getElementById('delivery-method').value;
      const comment = document.getElementById('customer-comment').value.trim();

      let itemsTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      if (hasEngraving) itemsTotal += 500;

      // Получение данных пользователя из Telegram
      const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
      const userName = user ? (user.username ? `@${user.username}` : user.first_name) : "Неизвестный";
      const userId = user ? user.id : "Не определен";

      // Формирование HTML-сообщения
      let messageText = `🔥 <b>НОВЫЙ ЗАКАЗ (KOZHEDELNIKOV)!</b>\n\n`;
      messageText += `📋 <b>Состав заказа:</b>\n`;
      cart.forEach((item, idx) => {
        messageText += `${idx + 1}. ${item.name} — ${item.qty} шт. (${(item.price * item.qty).toLocaleString()} ₽)\n`;
      });

      messageText += `\n🎨 <b>Цвет кожи:</b> ${color}\n`;
      if (hasEngraving) {
        messageText += `✍️ <b>Гравировка (+500 ₽):</b> ${engravingText || 'Да (без текста)'}\n`;
      }
      messageText += `🚚 <b>Доставка:</b> ${delivery}\n`;
      messageText += `📞 <b>Телефон:</b> <code>${phone}</code>\n`;
      if (comment) messageText += `💬 <b>Комментарий:</b> ${comment}\n`;
      messageText += `\n💰 <b>ИТОГО К ОПЛАТЕ:</b> <b>${itemsTotal.toLocaleString()} ₽</b>\n\n`;
      messageText += `👤 <b>Покупатель:</b> ${userName}\n`;
      messageText += `🆔 <b>Telegram ID:</b> <code>${userId}</code>`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: ADMIN_ID,
            text: messageText,
            parse_mode: 'HTML'
          })
        });

        if (response.ok) {
          if (tg && tg.showAlert) {
            tg.showAlert('✅ Заказ успешно оформлен! Мастер свяжется с вами для уточнения деталей.', () => {
              tg.close();
            });
          } else {
            alert('✅ Заказ успешно оформлен!');
            cart = [];
            updateCartUI();
            closeCartModal();
          }
        } else {
          throw new Error('Telegram API error');
        }
      } catch (err) {
        console.error(err);
        if (tg && tg.showAlert) tg.showAlert('Ошибка при отправке заказа. Проверьте подключение к сети.');
        else alert('Ошибка при отправке заказа.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Оформить заказ';
      }
    }

    renderProducts();
  </script>
</body>
</html>
